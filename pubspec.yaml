name: mix_match_mood
description: "Mix Match Mood helps you plan outfits from your wardrobe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  cupertino_icons: ^1.0.8

  # State management (manual providers, no code-gen)
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.3

  # UI & Animations
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1

  # 3D Avatar
  model_viewer_plus: ^1.7.2

  # Image handling
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Local storage (manual adapters, no generator)
  hive_flutter: ^1.1.0

  # Auth
  supabase_flutter: ^2.8.4
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

  # Utils
  geolocator: ^14.0.2
  shared_preferences: ^2.3.5
  package_info_plus: ^10.2.1
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
