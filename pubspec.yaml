name: wardrobly
description: "Smart wardrobe and outfit selection app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (manual providers, no code-gen)
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.3

  # UI & Animations
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1

  # 3D Avatar
  model_viewer_plus: ^1.7.2

  # Image handling
  image_picker: ^1.1.2

  # Local storage (manual adapters, no generator)
  hive_flutter: ^1.1.0

  # Auth
  supabase_flutter: ^2.8.4

  # Utils
  shared_preferences: ^2.3.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/avatars/
    - assets/images/
    - assets/images/mock_clothes/
