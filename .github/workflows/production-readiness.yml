name: Production readiness

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  avatar-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: tools/avatar/package-lock.json
      - run: tools/avatar/validate_assets.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: >-
          deno test
          supabase/functions/_shared/ai_consent_test.ts
          supabase/functions/_shared/account_deletion_test.ts
          supabase/functions/_shared/apple_account_deletion_test.ts
          supabase/functions/_shared/domain_test.ts
          supabase/functions/_shared/fashion_chat_test.ts
          supabase/functions/_shared/openai_test.ts
          supabase/functions/delete-account/delete_account_test.ts
          supabase/functions/generate-outfits/generate_outfits_test.ts
      - name: Type-check every Edge Function
        shell: bash
        run: |
          set -euo pipefail
          functions="$(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)"
          test -n "$functions"
          while IFS= read -r function; do
            deno check "$function"
          done <<< "$functions"

  supabase-db-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db --local
      - run: bash scripts/test_supabase_storage_security.sh

  ios-simulator-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter --version && dart --version && xcodebuild -version
      - run: flutter build ios --simulator

  ios-release-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter --version && dart --version && xcodebuild -version
      - run: flutter build ios --release --no-codesign

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter --version && dart --version && java -version
      - run: flutter build apk --debug

  android-release-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter --version && dart --version && java -version
      - name: Build an ephemerally signed release App Bundle
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/mmm-ci-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias mmm-ci \
            -dname "CN=MMM CI,O=CI,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/mmm-ci-release.jks" \
            'storePassword=changeit' \
            'keyAlias=mmm-ci' \
            'keyPassword=changeit' > android/key.properties
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mmm-ci-release.jks" android/key.properties

  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: scripts/release_preflight.sh --self-test
      - run: scripts/check_tracked_secrets.sh
